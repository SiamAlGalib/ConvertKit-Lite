.card{width:min(560px,100%);text-align:center;padding:44px 32px;border:1px solid #174b88;border-radius:22px;background:linear-gradient(160deg,rgba(10,33,66,.85),rgba(5,16,36,.92));box-shadow:0 20px 60px rgba(0,0,0,.35)}

a.ghost{background:transparent;border:1px solid #2b5d97;color:#d6e6ff;box-shadow:none}
html[data-theme="light"] body{color:#0d1b33;background:radial-gradient(600px 420px at 85% 8%,rgba(90,150,255,.3),transparent 70%),radial-gradient(520px 420px at 8% 80%,rgba(170,120,255,.22),transparent 70%),#f4f8ff}
