# Generates static blog pages from Firebase, commits them, then deploys the site to GitHub Pages.
name: Generate blog and deploy to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 */6 * * *"   # safety net: re-sync from Firebase every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # If this step fails (e.g. Firebase hiccup), the site still deploys with the existing pages.
      - name: Generate blog pages from Firebase
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/gen" firebase-admin
          node scripts/generate-blog.js
        env:
          NODE_PATH: ${{ runner.temp }}/gen/node_modules
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate static blog pages"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
